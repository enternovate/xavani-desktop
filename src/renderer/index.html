<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:*">
  <title>Xavani</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="boot">
    <img src="assets/mark.png" alt="" class="boot-mark">
    <div class="boot-title">Xavani</div>
    <div class="boot-sub" id="boot-sub">Starting engine…</div>
    <button id="boot-restart" class="btn ghost hidden">Restart engine</button>
  </div>

  <div id="app" class="hidden">
    <aside id="sidebar">
      <div class="brand">
        <img src="assets/mark.png" alt="" class="brand-mark">
        <span class="brand-name">Xavani</span>
        <span class="brand-ver" id="brand-ver"></span>
      </div>
      <button id="new-chat" class="btn primary block" title="New chat (⌘N)">
        <svg width="13" height="13" viewBox="0 0 12 12" fill="none"><path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        New chat
      </button>
      <nav class="side-nav">
        <button class="nav-item active" data-view="chat">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M12.5 7A5.5 5.5 0 1 1 7 1.5 5.5 5.5 0 0 1 12.5 7Z" stroke="currentColor"/><path d="M4.8 7h.01M7 7h.01M9.2 7h.01" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          Chat</button>
        <button class="nav-item" data-view="tools">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M8.6 2.2a3 3 0 0 0-3.9 3.9L1.5 9.3a1.4 1.4 0 0 0 2 2l3.2-3.2a3 3 0 0 0 3.9-3.9L8.9 5.9 7.4 5.9 7.4 4.4l1.2-2.2Z" stroke="currentColor" stroke-linejoin="round"/></svg>
          Tools</button>
        <button class="nav-item" data-view="skills">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1.5 8.6 5l3.9.4-2.9 2.6.8 3.8L7 9.9l-3.4 1.9.8-3.8L1.5 5.4 5.4 5 7 1.5Z" stroke="currentColor" stroke-linejoin="round"/></svg>
          Skills</button>
        <button class="nav-item" data-view="cron">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5.5" stroke="currentColor"/><path d="M7 4v3l2 1.4" stroke="currentColor" stroke-linecap="round"/></svg>
          Cron</button>
        <button class="nav-item" data-view="status">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 8.5 5 11l7-8" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Status</button>
      </nav>
      <div class="sessions-head">Recent</div>
      <div id="sessions"></div>
      <div class="sidebar-foot">
        <span class="dot" id="health-dot"></span>
        <span id="foot-model">—</span>
      </div>
    </aside>

    <main id="main">
      <header id="topbar">
        <div id="topbar-title">Chat</div>
        <div class="topbar-right">
          <span class="chip" id="chip-provider">—</span>
          <span class="chip mono" id="chip-model">—</span>
        </div>
      </header>

      <section id="view-chat" class="view active">
        <div id="messages"></div>

        <div id="approval" class="approval hidden">
          <div class="approval-head">
            <span class="approval-icon">!</span>
            <span>Command needs your approval</span>
          </div>
          <pre class="approval-cmd mono" id="approval-cmd"></pre>
          <div class="approval-actions">
            <button class="btn primary sm" data-choice="once">Allow once</button>
            <button class="btn ghost sm" data-choice="session">This session</button>
            <button class="btn ghost sm" data-choice="always">Always</button>
            <button class="btn danger sm" data-choice="deny">Deny</button>
          </div>
        </div>

        <div id="composer">
          <div class="composer-box">
            <textarea id="input" rows="1" placeholder="Message Xavani…  (Enter to send, Shift+Enter for newline)"></textarea>
            <button id="stop" class="btn danger sm hidden" title="Stop the agent">
              <svg width="11" height="11" viewBox="0 0 10 10"><rect x="1" y="1" width="8" height="8" rx="1.5" fill="currentColor"/></svg>
              Stop
            </button>
            <button id="send" class="btn primary sm" title="Send">
              <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M7 12V2m0 0L2.5 6.5M7 2l4.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <div class="composer-hint">
            <span id="run-state"></span>
            <span class="flex-spacer"></span>
            <span id="usage-chip" class="mono dim"></span>
          </div>
        </div>
      </section>

      <section id="view-tools" class="view"><div class="panel-wrap"><div id="tools-list" class="panel-list"></div></div></section>
      <section id="view-skills" class="view"><div class="panel-wrap"><div id="skills-list" class="panel-list"></div></div></section>
      <section id="view-cron" class="view"><div class="panel-wrap"><div id="cron-list" class="panel-list"></div></div></section>
      <section id="view-status" class="view"><div class="panel-wrap"><div id="status-panel" class="panel-list"></div></div></section>
    </main>
  </div>

  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
