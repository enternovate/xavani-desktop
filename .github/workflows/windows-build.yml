name: windows-build

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'README.md'

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Checkout engine (xavani-agent)
        uses: actions/checkout@v4
        with:
          repository: enternovate/xavani-agent
          path: engine-src
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'

      - name: Install app dependencies
        run: npm ci --no-audit --no-fund

      - name: Install electron-builder
        run: npm i --no-save --no-audit --no-fund electron-builder

      - name: Bundle standalone Python runtime
        shell: pwsh
        run: |
          uv python install 3.13
          $root = (uv python dir).Trim()
          $src = Get-ChildItem $root -Directory -Filter 'cpython-3.13*' |
            Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $src) { Write-Host "::error::no cpython-3.13 under $root"; exit 1 }
          Write-Host "runtime source: $src"
          New-Item -ItemType Directory -Force -Path backend | Out-Null
          New-Item -ItemType Directory -Force -Path backend\runtime | Out-Null
          Copy-Item -Path "$src\*" -Destination backend\runtime -Recurse -Force
          if (-not (Test-Path backend\runtime\python.exe)) {
            Write-Host "::error::python.exe missing after copy"
            Get-ChildItem backend\runtime | Select-Object -First 20 Name
            exit 1
          }
          Get-ChildItem -Recurse backend\runtime -Filter EXTERNALLY-MANAGED -ErrorAction SilentlyContinue | Remove-Item -Force

      - name: Copy engine source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path backend\engine | Out-Null
          robocopy engine-src backend\engine /E /NFL /NDL /NJH /NJS /XD .git node_modules tests website docs docker nix .github datagen-config-examples dist build .venv __pycache__ ui-tui .ruff_cache .pytest_cache /XF *.pyc | Out-Null
          if ($LASTEXITCODE -le 7) { exit 0 } else { exit $LASTEXITCODE }

      - name: Engine dependencies (from uv.lock)
        shell: pwsh
        run: |
          Push-Location engine-src
          uv export --frozen --no-dev --no-hashes --no-emit-project --format requirements-txt -o ..\reqs.txt
          Pop-Location
          uv pip install --python backend\runtime\python.exe -r reqs.txt aiohttp

      - name: Checkout constellation products
        uses: actions/checkout@v4
        with: { repository: enternovate/gavaza, path: const/gavaza }
      - uses: actions/checkout@v4
        with: { repository: enternovate/nyarhi, path: const/nyarhi }
      - uses: actions/checkout@v4
        with: { repository: enternovate/mhangani, path: const/mhangani }
      - uses: actions/checkout@v4
        with: { repository: enternovate/constellation-mcp, path: const/constellation-mcp }

      - name: Install constellation products + pty support
        shell: pwsh
        run: |
          uv pip install --python backend\runtime\python.exe .\const\gavaza .\const\nyarhi .\const\mhangani .\const\constellation-mcp pywinpty

      - name: Build Windows installers
        shell: pwsh
        run: npx electron-builder --win --x64

      - uses: actions/upload-artifact@v4
        with:
          name: xavani-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

      - name: Attach to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref_name, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --title "Xavani Desktop ${TAG#v}" --latest=false
          gh release upload "$TAG" dist/*.exe dist/*.zip --repo "$GITHUB_REPOSITORY" --clobber
